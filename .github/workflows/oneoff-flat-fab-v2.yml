name: Flat MUSHIN FAB patch v2

on:
  push:
    paths:
      - 'MUSHIN_FLAT_FAB_V2_TRIGGER'
      - '.github/workflows/oneoff-flat-fab-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch FAB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/jp/mushamusha/gomireminder/MainActivity.kt')
          s = p.read_text()
          old = 'floatingActionButton = { SmallFloatingActionButton(onClick = { adding = true }) { Text("＋") } }'
          new = '''floatingActionButton = {
            SmallFloatingActionButton(
                onClick = { adding = true },
                containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.82f),
                contentColor = MaterialTheme.colorScheme.onSurface,
                elevation = FloatingActionButtonDefaults.elevation(
                    defaultElevation = 0.dp,
                    pressedElevation = 0.dp,
                    focusedElevation = 0.dp,
                    hoveredElevation = 0.dp
                )
            ) { Text("＋") }
        }'''
          if old not in s:
              raise SystemExit('FAB anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f MUSHIN_FLAT_FAB_TRIGGER MUSHIN_FLAT_FAB_V2_TRIGGER
          rm -f .github/workflows/oneoff-flat-fab.yml .github/workflows/oneoff-flat-fab-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Flatten garbage reminder add control'
          git push
