name: Garbage Reminder MUSHIN FAB patch v3

on:
  push:
    paths:
      - 'tools/oneoff_flat_mushin_fab.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 tools/oneoff_flat_mushin_fab.py
      - name: Commit source patch and cleanup
        run: |
          rm -f MUSHIN_FLAT_FAB_TRIGGER MUSHIN_FLAT_FAB_V2_TRIGGER
          rm -f .github/workflows/oneoff-flat-fab.yml .github/workflows/oneoff-flat-fab-v2.yml .github/workflows/oneoff-flat-fab-v3.yml
          rm -f tools/oneoff_flat_mushin_fab.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Flatten garbage reminder add control'
          git push
